name: Build and Push Frontend Image

# K8s manifests live in the homelab monorepo at
# k8s/apps/donetick-frontend/. Bump the image tag there to roll out
# a new version (manual for now).

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.forgejo/workflows/build-and-deploy.yaml'

env:
  REGISTRY: forgejo.lab.themalinconicos.com
  IMAGE_NAME: brian/donetick-frontend

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: docker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Forgejo Registry
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login ${{ env.REGISTRY }} -u token --password-stdin

      - name: Build image
        run: |
          docker build \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .

      - name: Push image
        run: |
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
